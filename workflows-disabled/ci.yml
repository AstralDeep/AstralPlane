name: AstralPlane CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: astralplane-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-and-architecture:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build the standalone wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install and import the wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import astralplane; assert astralplane.CONTRACT_VERSION == 'astralplane.contract/v1'"
      - name: Check the dependency direction
        run: python tests/architecture/test_dependency_direction.py
