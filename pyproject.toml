[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "astralplane"
version = "0.1.0"
description = "Embedded durable-state library for AstralDeep compositions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg2-binary>=2.9.0"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/AstralDeep/AstralPlane"

[dependency-groups]
ci = [
  "diff-cover==10.3.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pyyaml==6.0.3",
  "ruff==0.15.21",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["astralplane*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
